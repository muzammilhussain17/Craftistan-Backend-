# Production Profile
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:craftistan}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    hikari:
      connection-timeout: 30000
      max-lifetime: 240000        # was 290000 — safer buffer below Neon's 300s limit
      keepalive-time: 30000
      idle-timeout: 120000        # NEW — evict idle connections before PgBouncer kills them
      maximum-pool-size: 5
      minimum-idle: 1
      validation-timeout: 5000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false           # suppress warning + good practice
    show-sql: false
    properties:
      hibernate:
        dialect:                  # removed — Hibernate 6 auto-detects PostgreSQL

  flyway:
    enabled: true

app:
  mail:
    from: ${APP_MAIL_FROM:muzammilhussain0a0@gmail.com}

logging:
  level:
    com.craftistan: INFO
    org.springframework: WARN

management:
  health:
    mail:
      enabled: false