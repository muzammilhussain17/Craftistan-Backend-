# Production Profile
spring:
  datasource:
    # Use SPRING_DATASOURCE_URL if set (recommended for Neon: include ?sslmode=require)
    # Otherwise fall back to assembling from individual DB_* vars
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:craftistan}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    hikari:
      connection-timeout: 30000    # 30s — tolerates Neon cold-start
      max-lifetime: 290000         # 290s — must be LESS than Neon's 300s server timeout
      keepalive-time: 30000        # ping idle connections every 30s — prevents stale connections
      maximum-pool-size: 5         # keep small for Railway free plan RAM
      minimum-idle: 1
      validation-timeout: 5000     # fail fast on bad connections
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

# Application — production sender address
app:
  mail:
    from: ${APP_MAIL_FROM:noreply@craftistan.com}

# Logging
logging:
  level:
    com.craftistan: INFO
    org.springframework: WARN

# Actuator — disable mail health check until Brevo is configured
# Without this, /actuator/health hangs for 2+ minutes when SMTP is unreachable
management:
  health:
    mail:
      enabled: false
